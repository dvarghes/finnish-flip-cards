<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finnish Flip Cards</title>
<style>
  :root {
    --bg: #0f172a;
    --card-bg: #1e293b;
    --front: #1e40af;
    --back: #065f46;
    --text: #f1f5f9;
    --accent: #38bdf8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }
  h1 { margin-bottom: 8px; font-size: 1.8rem; }
  .subtitle { color: #94a3b8; margin-bottom: 20px; font-size: 0.95rem; }
  .progress {
    width: 100%;
    max-width: 420px;
    background: #334155;
    border-radius: 999px;
    height: 8px;
    margin-bottom: 20px;
    overflow: hidden;
  }
  .progress-bar {
    height: 100%;
    background: linear-gradient(90deg, #38bdf8, #22d3ee);
    width: 0%;
    transition: width 0.3s;
  }
  .counter { margin-bottom: 16px; color: #cbd5e1; font-size: 0.95rem; }
  .card-container {
    perspective: 1000px;
    width: 100%;
    max-width: 420px;
    height: 280px;
    margin-bottom: 24px;
  }
  .card {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    cursor: pointer;
  }
  .card.flipped { transform: rotateY(180deg); }
  .card-face {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 30px;
    text-align: center;
    box-shadow: 0 20px 40px rgba(0,0,0,0.4);
  }
  .card-front { background: var(--front); }
  .card-back { background: var(--back); transform: rotateY(180deg); }
  .word { font-size: 1.7rem; font-weight: 700; line-height: 1.3; }
  .hint { margin-top: 12px; font-size: 0.85rem; opacity: 0.7; }
  .controls {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 20px;
  }
  button {
    background: #334155;
    color: white;
    border: none;
    padding: 12px 22px;
    border-radius: 12px;
    font-size: 1rem;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
  }
  button:hover { background: #475569; }
  button:active { transform: scale(0.97); }
  button.primary { background: #0284c7; }
  button.primary:hover { background: #0369a1; }
  button.success { background: #059669; }
  button.success:hover { background: #047857; }
  .stats {
    display: flex;
    gap: 20px;
    font-size: 0.9rem;
    color: #94a3b8;
  }
  .stats span { font-weight: 600; color: #e2e8f0; }
  @media (max-width: 480px) {
    .word { font-size: 1.4rem; }
    .card-container { height: 240px; }
  }
</style>
</head>
<body>
  <h1>Finnish Flip Cards</h1>
  <p class="subtitle">Click the card to flip • Learn Finnish vocabulary</p>
  
  <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
  <div class="counter" id="counter">Card 1 / 120</div>
  
  <div class="card-container">
    <div class="card" id="card" onclick="flipCard()">
      <div class="card-face card-front">
        <div class="word" id="frontText">Loading...</div>
        <div class="hint">Finnish</div>
      </div>
      <div class="card-face card-back">
        <div class="word" id="backText">Translation</div>
        <div class="hint">English</div>
      </div>
    </div>
  </div>
  
  <div class="controls">
    <button onclick="prevCard()">← Previous</button>
    <button class="primary" onclick="flipCard()">Flip</button>
    <button onclick="nextCard()">Next →</button>
  </div>
  <div class="controls">
    <button onclick="shuffleDeck()">🔀 Shuffle</button>
    <button class="success" onclick="markKnown()">✓ I know this</button>
  </div>
  
  <div class="stats">
    <div>Known: <span id="knownCount">0</span></div>
    <div>Remaining: <span id="remainingCount">120</span></div>
  </div>

let currentIndex = 0;
let known = new Set();
let isFlipped = false;

function updateDisplay() {
  const card = document.getElementById("card");
  const item = deck[currentIndex];
  document.getElementById("frontText").textContent = item.fi;
  document.getElementById("backText").textContent = item.en;
  document.getElementById("counter").textContent = `Card ${currentIndex + 1} / ${deck.length}`;
  document.getElementById("progressBar").style.width = ((currentIndex + 1) / deck.length * 100) + "%";
  document.getElementById("knownCount").textContent = known.size;
  document.getElementById("remainingCount").textContent = deck.length - known.size;
  card.classList.remove("flipped");
  isFlipped = false;
}

function flipCard() {
  document.getElementById("card").classList.toggle("flipped");
  isFlipped = !isFlipped;
}

function nextCard() {
  currentIndex = (currentIndex + 1) % deck.length;
  updateDisplay();
}

function prevCard() {
  currentIndex = (currentIndex - 1 + deck.length) % deck.length;
  updateDisplay();
}

function shuffleDeck() {
  for (let i = deck.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [deck[i], deck[j]] = [deck[j], deck[i]];
  }
  currentIndex = 0;
  updateDisplay();
}

function markKnown() {
  known.add(currentIndex);
  nextCard();
}

// Keyboard support
document.addEventListener("keydown", (e) => {
  if (e.key === " " || e.key === "Enter") { e.preventDefault(); flipCard(); }
  if (e.key === "ArrowRight") nextCard();
  if (e.key === "ArrowLeft") prevCard();
  if (e.key === "k" || e.key === "K") markKnown();
});

updateDisplay();
</script>
